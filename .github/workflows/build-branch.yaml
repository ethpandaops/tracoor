name: Build branch docker image

# Builds scratch and debian images from a branch with only GITHUB_TOKEN,
# publishes them to ghcr.io/ethpandaops/tracoor and mirrors them to
# docker.io/ethpandaops/tracoor. Every tag is one linux/amd64 + linux/arm64
# image.
#
# - Pushes to release/<name> (and dispatches on them) publish <name>-latest,
#   <name> and <name>-<sha7>, plus <name>-debian-latest, <name>-debian and
#   <name>-<sha7>-debian.
# - Same-repository pull requests labelled `build-docker-image` publish
#   <branch> and <branch>-<sha7>, plus <branch>-debian and
#   <branch>-<sha7>-debian, built from the PR head commit.
# - Manual dispatch on any other branch builds it the same way, optionally
#   under a custom name.
#
# Outside release/ refs, names that would overwrite a release image are
# refused (see the prepare job).
#
# This triggers on `pull_request`, NOT `pull_request_target`: fork PRs get no
# secrets or package write access and are skipped. Dispatch the workflow on a
# trusted branch to publish one.

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag (defaults to the branch name; ignored on release/ branches)"
        required: false

# One build per PR or ref; a newer push cancels the running build. Adding any
# other label to a PR gets its own group, so it can't cancel a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'build-docker-image' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Resolve image tags
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      build_docker: ${{ steps.resolve.outputs.build_docker }}
      name: ${{ steps.resolve.outputs.name }}
      sha: ${{ steps.resolve.outputs.sha }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      tags: ${{ steps.resolve.outputs.tags }}
      debian_tags: ${{ steps.resolve.outputs.debian_tags }}
    steps:
      - name: Resolve name and tags
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-docker-image') }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DOCKER_TAG: ${{ inputs.docker_tag }}
          # The exact PR head, so the image is the branch's code and not the
          # PR/master merge commit.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          release=false
          if [[ $GITHUB_REF == refs/heads/release/* ]]; then
            release=true
            name=${GITHUB_REF#refs/heads/release/}
          else
            name=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
            if [[ -n $DOCKER_TAG ]]; then
              name=$DOCKER_TAG
            fi
          fi
          # Docker tags allow [A-Za-z0-9_.-] only.
          name=${name//[^A-Za-z0-9_.-]/-}
          sha=${PR_HEAD_SHA:-$GITHUB_SHA}
          sha7=${sha:0:7}

          build=false
          case $EVENT in
            push | workflow_dispatch)
              build=true
              ;;
            pull_request)
              if [[ $HAS_LABEL != true ]]; then
                echo "No build-docker-image label."
              elif [[ $ACTION == labeled && $ADDED_LABEL != build-docker-image ]]; then
                echo "The added label is ${ADDED_LABEL}, not build-docker-image."
              elif [[ $SAME_REPOSITORY != true ]]; then
                echo "::notice::Skipping a fork PR; dispatch this workflow on a trusted branch to publish it."
              else
                build=true
              fi
              ;;
          esac

          # Branch builds must never overwrite release tags.
          if [[ $build == true && $release == false ]]; then
            skip=""
            if [[ $name == master || $name == main || $name == *latest ]]; then
              skip="${name} is reserved for releases"
            elif [[ $name =~ ^v?[0-9] ]]; then
              skip="${name} looks like a version"
            else
              # Prints the names whose tags include tags of $1: $1 itself, and
              # $1 without a -debian and then a -<sha7> suffix.
              roots() {
                local x=$1
                echo "$x"
                if [[ $x =~ ^(.+)-debian$ ]]; then
                  x=${BASH_REMATCH[1]}
                  echo "$x"
                fi
                if [[ $x =~ ^(.+)-[0-9a-f]{7}$ ]]; then
                  echo "${BASH_REMATCH[1]}"
                fi
              }
              # A failed lookup fails the job rather than risk overwriting
              # release tags.
              heads=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" 'release/*')
              # Compared after slugifying, as release/<a>/<b> publishes <a>-<b>.
              # Skip when a tag this build publishes (<name>, <name>-debian,
              # <name>-<sha7>, <name>-<sha7>-debian) is also one the release
              # branch publishes, e.g. name glamsterdam-devnet-11-debian.
              while read -r _ ref; do
                [[ $ref == refs/heads/release/* ]] || continue
                taken=${ref#refs/heads/release/}
                taken=${taken//[^A-Za-z0-9_.-]/-}
                if grep -qxF -- "$taken" <<< "$(roots "$name")" || grep -qxF -- "$name" <<< "$(roots "$taken")"; then
                  skip="${name} overlaps the tags of ${ref#refs/heads/}"
                  break
                fi
              done <<< "$heads"
            fi
            if [[ -n $skip ]]; then
              echo "::warning::Not building: ${skip}. Rename the branch or dispatch with another docker_tag."
              build=false
            fi
          fi

          # A Docker tag is at most 128 characters; the longest has the
          # 15-character -<sha7>-debian suffix.
          if [[ $build == true && ! $name =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,112}$ ]]; then
            echo "::error::${name} can't be a Docker tag: it must start with [A-Za-z0-9_] and be at most 113 characters."
            exit 1
          fi

          if [[ $release == true ]]; then
            tags="${name}-latest ${name} ${name}-${sha7}"
            debian_tags="${name}-debian-latest ${name}-debian ${name}-${sha7}-debian"
          else
            tags="${name} ${name}-${sha7}"
            debian_tags="${name}-debian ${name}-${sha7}-debian"
          fi

          echo "event=${EVENT} release=${release} name=${name} sha=${sha} build=${build}"
          echo "tags: ${tags}"
          echo "debian tags: ${debian_tags}"
          {
            echo "build_docker=${build}"
            echo "name=${name}"
            echo "sha=${sha}"
            echo "sha7=${sha7}"
            echo "tags=${tags}"
            echo "debian_tags=${debian_tags}"
          } >> "$GITHUB_OUTPUT"

  build_docker:
    name: Build docker images
    needs: prepare
    if: needs.prepare.outputs.build_docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/ethpandaops/tracoor
      NAME: ${{ needs.prepare.outputs.name }}
      SHA: ${{ needs.prepare.outputs.sha }}
      SHA7: ${{ needs.prepare.outputs.sha7 }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      DEBIAN_TAGS: ${{ needs.prepare.outputs.debian_tags }}
    outputs:
      digests: ${{ steps.attest-scratch.outputs.digests }} ${{ steps.attest-debian.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }} # exact branch HEAD, NOT the PR/master merge.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      - name: Set up NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      # The server embeds web/build, so the frontend is built first.
      - name: Build web frontend
        run: make build-web
      # .goreleaser.yaml's linux builds, stamped <name>-<sha7> (tracoor.Full()
      # is Release-GitCommit) instead of a release tag. Each binary goes into
      # its own build context, which the release Dockerfiles COPY as tracoor*.
      - name: Build binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w -X github.com/ethpandaops/tracoor/pkg/proto/tracoor.Release=${NAME} -X github.com/ethpandaops/tracoor/pkg/proto/tracoor.GitCommit=${SHA7}" \
              -o "${RUNNER_TEMP}/context/${arch}/tracoor" .
            file "${RUNNER_TEMP}/context/${arch}/tracoor"
          done
      # The debian image runs apt-get, which needs emulation for linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each platform is built from its own binary and pushed by digest, then
      # the two are joined into one multi-arch manifest under every tag.
      - name: Build and push docker images
        id: images
        run: |
          set -euo pipefail
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          publish() {
            local dockerfile=$1 output=$2 arch meta refs=() tag_args=() tag
            shift 2
            for tag in "$@"; do
              tag_args+=(--tag "${IMAGE}:${tag}")
            done
            for arch in amd64 arm64; do
              meta="${RUNNER_TEMP}/metadata-${output}-${arch}.json"
              docker buildx build "${RUNNER_TEMP}/context/${arch}" \
                --file "$dockerfile" \
                --platform "linux/${arch}" \
                --provenance=false \
                --sbom=false \
                --label "org.opencontainers.image.created=${created}" \
                --label "org.opencontainers.image.title=tracoor" \
                --label "org.opencontainers.image.revision=${SHA}" \
                --label "org.opencontainers.image.version=${NAME}-${SHA7}" \
                --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
                --metadata-file "$meta"
              refs+=("${IMAGE}@$(jq -r '."containerimage.digest"' "$meta")")
            done
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
            digest=$(docker buildx imagetools inspect "${IMAGE}:$1" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${IMAGE} tags $* are ${digest}"
            echo "${output}=${digest}" >> "$GITHUB_OUTPUT"
          }

          read -ra tags <<<"$TAGS"
          read -ra debian_tags <<<"$DEBIAN_TAGS"
          publish goreleaser-scratch.Dockerfile scratch "${tags[@]}"
          publish goreleaser-debian.Dockerfile debian "${debian_tags[@]}"
      - name: Attest scratch image
        id: attest-scratch
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: tracoor
          tags: ${{ env.TAGS }}
          digest: ${{ steps.images.outputs.scratch }}
          mirror: "false"
      - name: Attest debian image
        id: attest-debian
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: tracoor
          tags: ${{ env.DEBIAN_TAGS }}
          digest: ${{ steps.images.outputs.debian }}
          mirror: "false"

  # Separate job, so "Re-run failed jobs" retries only the mirror and never
  # rebuilds the images.
  mirror:
    name: Mirror to Docker Hub
    needs: build_docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: tracoor
          tags: ${{ needs.build_docker.outputs.digests }}
          attest: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
