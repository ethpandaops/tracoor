name: Go Test

on:
  pull_request:

  workflow_dispatch:
    branches: [ '**' ]

jobs:
  full_ci:
    strategy:
      matrix:
        go_version: [ 1.26.x ]

    runs-on: ubuntu-24.04

    # Nothing here needs cgo - the sqlite driver is pure Go - and every artifact build
    # (Dockerfile, goreleaser) already pins this. With cgo on, ethkit and go-ethereum each
    # compile their own copy of libsecp256k1 and the test binaries fail to link with
    # "multiple definition of secp256k1_*". Older binutils tolerate it; newer ones do not,
    # so the runner image is the only thing standing between this job and a red build.
    env:
      CGO_ENABLED: 0

    steps:
      - name: checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: ${{ matrix.go_version }}

      - name: run tests
        run: go test -json ./... | tee test.json

