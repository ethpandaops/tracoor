server:
  addr: ":8081"
  gatewayAddr: ":7007"
  pprofAddr: ":6060"
  preStopSleepSeconds: 1

  persistence:
    dsn: "file:/tmp/tracoor.db"
    driver_name: sqlite

  services:
    indexer:
      retention:
        beaconStates: 30m
        executionBlockTraces: 30m
        beaconBlocks: 30m
        executionPayloadEnvelopes: 30m
    # Copy interesting (pre-state, block) pairs out of the retention buffer into a
    # separate, append-only corpus that outlives the network. Opt-in, and never
    # deletes anything. See example_server_config.yaml for every available option.
    # NOTE: beaconStates/beaconBlocks/executionPayloadEnvelopes retention must exceed
    # (lagEpochs + 1) * slotsPerEpoch * secondsPerSlot, or the server refuses to start
    # - the 30m above is not enough for the 12s/32 network below.
    # promotion:
    #   enabled: true
    #   lagEpochs: 2
    #   checkInterval: 30s
    #   slotsPerEpoch: 32
    #   secondsPerSlot: 12s
    #   store:              # the corpus; must NOT be the buffer store below
    #     type: fs
    #     config:
    #       base_path: "/tmp/tracoor-corpus"
  # Use the following to configure Tracoor for a custom network
  # ethereum:
  #   config:
  #     repository: ethpandaops/devnet-repo
  #     branch: master
  #     path: network-configs/devnet-name/metadata
  #   tools:
  #     ncli:
  #       repository: status-im/nimbus-eth2
  #       branch: unstable
  #     lcli:
  #       repository: sigp/lighthouse
  #       branch: unstable
  #     zcli:
  #       fork: consensus-fork-name

agents:
  - name: instance-1
    ethereum:
      overrideNetworkName: mainnet
      # features:
      #   fetchBeaconState: true
      #   fetchBeaconBlock: true
      #   fetchExecutionPayloadEnvelope: true
      #   fetchBeaconBadBlock: true
      #   fetchBeaconBadBlob: true
      #   fetchExecutionBlockTrace: true
      #   fetchExecutionBadBlock: true
      beacon:
        nodeAddress: http://instance-1:5052
        # Prysm
        # requires --save-invalid-block-temp and --save-invalid-blob-temp flags enabled
        # Always stored in os.tmpdir(), eg. /tmp
        # invalidGossipVerifiedBlocksPath: /tmp
        # invalidGossipVerifiedBlobsPath: /tmp

        # Nimbus
        # requires --dump flag enabled
        # replace data-dir with the --data-dir flag value
        # invalidGossipVerifiedBlocksPath: /data-dir/dump/invalid

        # Lighthouse
        # requires --invalid-gossip-verified-blocks-path flag set eg. =/data/invalid
        # invalidGossipVerifiedBlocksPath: /data/invalid
      execution:
        nodeAddress: http://instance-1:8545
        traceDisableMemory: true
        traceDisableStack: true
        traceDisableStorage: true

shared:
  metricsAddr: ":9091"
  logging: "debug"
  # How long each agent waits for in-flight fetches and uploads after a
  # shutdown signal. Keep it below the orchestrator's termination grace period.
  shutdownTimeoutSeconds: 10
  # Deadline for one fetch attempt, per artifact kind, shared by every agent
  # (an agent may still set its own). The defaults suit agents running near
  # their nodes; over a WAN link beacon states need minutes, not seconds.
  # fetchTimeouts:
  #   beaconStateSeconds: 30
  #   beaconBlockSeconds: 30
  #   executionPayloadEnvelopeSeconds: 60
  #   executionBlockTraceSeconds: 60
  #   executionBadBlockSeconds: 60
  indexer:
    address: localhost:8081
  store:
    type: fs
    config:
      base_path: "/tmp/tracoor"
