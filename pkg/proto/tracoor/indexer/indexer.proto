message Config {
  EthereumConfig ethereum = 1;
}

message EthereumConfig {
  google.protobuf.StringValue network = 1;
  EthereumNetworkConfig config = 2;
  ToolsConfig tools = 3;
}

message EthereumNetworkConfig {
  google.protobuf.StringValue repository = 1;
  google.protobuf.StringValue branch = 2;
  google.protobuf.StringValue path = 3;
}

message ToolsConfig {
  GitRepositoryConfig ncli = 1;
  GitRepositoryConfig lcli = 2;
  ZcliConfig zcli = 3;
}

message GitRepositoryConfig {
  google.protobuf.StringValue repository = 1;
  google.protobuf.StringValue branch = 2;
}

message ZcliConfig {
  google.protobuf.StringValue fork = 1;
}

service Indexer {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {}

  rpc GetStorageHandshakeToken(GetStorageHandshakeTokenRequest)
      returns (GetStorageHandshakeTokenResponse) {}
  // BeaconState
  rpc CreateBeaconState(CreateBeaconStateRequest)
      returns (CreateBeaconStateResponse) {}
  rpc ListBeaconState(ListBeaconStateRequest)
      returns (ListBeaconStateResponse) {}
  rpc CountBeaconState(CountBeaconStateRequest)
      returns (CountBeaconStateResponse) {}
  rpc ListUniqueBeaconStateValues(ListUniqueBeaconStateValuesRequest)
      returns (ListUniqueBeaconStateValuesResponse) {}
  // BeaconBlock
  rpc CreateBeaconBlock(CreateBeaconBlockRequest)
      returns (CreateBeaconBlockResponse) {}
  rpc ListBeaconBlock(ListBeaconBlockRequest)
      returns (ListBeaconBlockResponse) {}
  rpc CountBeaconBlock(CountBeaconBlockRequest)
      returns (CountBeaconBlockResponse) {}
  rpc ListUniqueBeaconBlockValues(ListUniqueBeaconBlockValuesRequest)
      returns (ListUniqueBeaconBlockValuesResponse) {}

  // ExecutionPayloadEnvelope
  rpc CreateExecutionPayloadEnvelope(CreateExecutionPayloadEnvelopeRequest)
      returns (CreateExecutionPayloadEnvelopeResponse) {}
  rpc ListExecutionPayloadEnvelope(ListExecutionPayloadEnvelopeRequest)
      returns (ListExecutionPayloadEnvelopeResponse) {}
  rpc CountExecutionPayloadEnvelope(CountExecutionPayloadEnvelopeRequest)
      returns (CountExecutionPayloadEnvelopeResponse) {}
  rpc ListUniqueExecutionPayloadEnvelopeValues(
      ListUniqueExecutionPayloadEnvelopeValuesRequest)
      returns (ListUniqueExecutionPayloadEnvelopeValuesResponse) {}
  // BeaconBadBlock
  rpc CreateBeaconBadBlock(CreateBeaconBadBlockRequest)
      returns (CreateBeaconBadBlockResponse) {}
  rpc ListBeaconBadBlock(ListBeaconBadBlockRequest)
      returns (ListBeaconBadBlockResponse) {}
  rpc CountBeaconBadBlock(CountBeaconBadBlockRequest)
      returns (CountBeaconBadBlockResponse) {}
  rpc ListUniqueBeaconBadBlockValues(ListUniqueBeaconBadBlockValuesRequest)
      returns (ListUniqueBeaconBadBlockValuesResponse) {}
  // BeaconBadBlob
  rpc CreateBeaconBadBlob(CreateBeaconBadBlobRequest)
      returns (CreateBeaconBadBlobResponse) {}
  rpc ListBeaconBadBlob(ListBeaconBadBlobRequest)
      returns (ListBeaconBadBlobResponse) {}
  rpc CountBeaconBadBlob(CountBeaconBadBlobRequest)
      returns (CountBeaconBadBlobResponse) {}
  rpc ListUniqueBeaconBadBlobValues(ListUniqueBeaconBadBlobValuesRequest)
      returns (ListUniqueBeaconBadBlobValuesResponse) {}
  // ExecutionBlockTrace
  rpc CreateExecutionBlockTrace(CreateExecutionBlockTraceRequest)
      returns (CreateExecutionBlockTraceResponse) {}
  rpc ListExecutionBlockTrace(ListExecutionBlockTraceRequest)
      returns (ListExecutionBlockTraceResponse) {}
  rpc CountExecutionBlockTrace(CountExecutionBlockTraceRequest)
      returns (CountExecutionBlockTraceResponse) {}
  rpc ListUniqueExecutionBlockTraceValues(
      ListUniqueExecutionBlockTraceValuesRequest)
      returns (ListUniqueExecutionBlockTraceValuesResponse) {}
  // ExecutionBadBlock
  rpc CreateExecutionBadBlock(CreateExecutionBadBlockRequest)
      returns (CreateExecutionBadBlockResponse) {}
  rpc ListExecutionBadBlock(ListExecutionBadBlockRequest)
      returns (ListExecutionBadBlockResponse) {}
  rpc CountExecutionBadBlock(CountExecutionBadBlockRequest)
      returns (CountExecutionBadBlockResponse) {}
  rpc ListUniqueExecutionBadBlockValues(
      ListUniqueExecutionBadBlockValuesRequest)
      returns (ListUniqueExecutionBadBlockValuesResponse) {}
  // Blob
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse) {}
  rpc CreateBlob(CreateBlobRequest) returns (CreateBlobResponse) {}
  // PayloadDivergence
  rpc CreatePayloadDivergence(CreatePayloadDivergenceRequest)
      returns (CreatePayloadDivergenceResponse) {}
  rpc ListPayloadDivergence(ListPayloadDivergenceRequest)
      returns (ListPayloadDivergenceResponse) {}
}

// Blob is the deduplicated payload shared by every artifact row that observed
// the same bytes for the same dedup key.
message Blob {
  google.protobuf.StringValue kind = 1;
  google.protobuf.StringValue network = 2;
  google.protobuf.StringValue dedup_key = 3;
  google.protobuf.StringValue content_hash = 4;
  google.protobuf.StringValue location = 5;
  google.protobuf.StringValue content_encoding = 6;
  google.protobuf.Int64Value raw_size = 7;
  google.protobuf.Int64Value compressed_size = 8;
  google.protobuf.Int64Value ref_count = 9;
  // "ready" or "deleting". Only "ready" blobs may be linked.
  google.protobuf.StringValue state = 10;
  google.protobuf.Int64Value generation = 11;
  google.protobuf.Timestamp created_at = 12;
}

message GetBlobRequest {
  google.protobuf.StringValue kind = 1;
  google.protobuf.StringValue network = 2;
  google.protobuf.StringValue dedup_key = 3;
}

message GetBlobResponse { Blob blob = 1; }

message CreateBlobRequest {
  google.protobuf.StringValue kind = 1;
  google.protobuf.StringValue network = 2;
  google.protobuf.StringValue dedup_key = 3;
  google.protobuf.StringValue content_hash = 4;
  google.protobuf.StringValue location = 5;
  google.protobuf.StringValue content_encoding = 6;
  google.protobuf.Int64Value raw_size = 7;
  google.protobuf.Int64Value compressed_size = 8;
}

message CreateBlobResponse {
  // The row that won the insert: freshly created or already present. A caller
  // that lost the race compares hashes against it.
  Blob blob = 1;
}

// PayloadDivergence records that a node served bytes whose hash did not match
// the canonical blob for the same dedup key.
message PayloadDivergence {
  google.protobuf.StringValue id = 1;
  google.protobuf.Timestamp observed_at = 2;
  google.protobuf.StringValue network = 3;
  google.protobuf.StringValue kind = 4;
  google.protobuf.StringValue node = 5;
  google.protobuf.StringValue dedup_key = 6;
  google.protobuf.StringValue expected_hash = 7;
  google.protobuf.StringValue actual_hash = 8;
  google.protobuf.UInt64Value slot = 9;
  google.protobuf.StringValue identifier = 10;
  // 1 = first observation, 2 = the single re-fetch.
  google.protobuf.Int32Value attempt = 11;
  google.protobuf.StringValue severity = 12;
  // Location of the divergent copy, empty when it was not stored.
  google.protobuf.StringValue location = 13;
}

message CreatePayloadDivergenceRequest {
  google.protobuf.Timestamp observed_at = 1;
  google.protobuf.StringValue network = 2;
  google.protobuf.StringValue kind = 3;
  google.protobuf.StringValue node = 4;
  google.protobuf.StringValue dedup_key = 5;
  google.protobuf.StringValue expected_hash = 6;
  google.protobuf.StringValue actual_hash = 7;
  google.protobuf.UInt64Value slot = 8;
  google.protobuf.StringValue identifier = 9;
  google.protobuf.Int32Value attempt = 10;
  google.protobuf.StringValue severity = 11;
  google.protobuf.StringValue location = 12;
}

message CreatePayloadDivergenceResponse {
  google.protobuf.StringValue id = 1;
}

message ListPayloadDivergenceRequest {
  string network = 1;
  string kind = 2;
  string dedup_key = 3;
  google.protobuf.Timestamp before = 4;
  google.protobuf.Timestamp after = 5;
  PaginationCursor pagination = 6;
}

message ListPayloadDivergenceResponse {
  repeated PayloadDivergence payload_divergences = 1;
}

