  google.protobuf.StringValue block_root = 6;
  google.protobuf.StringValue node_version = 7;
  google.protobuf.StringValue location = 8;
  google.protobuf.StringValue network = 9;
  google.protobuf.StringValue beacon_implementation = 10;
  google.protobuf.StringValue content_encoding = 11;
  google.protobuf.StringValue content_hash = 12;
  // Set when these bytes were read and hashed from this node.
  google.protobuf.Timestamp verified_at = 13;
  // Set when the hash was compared against an existing payload and matched.
  google.protobuf.Timestamp content_matched_at = 14;
  // How many nodes' verified payloads share this content hash, this one
  // included. Unset when there is no ready blob to count against.
  google.protobuf.UInt32Value agreement_count = 15;
}

